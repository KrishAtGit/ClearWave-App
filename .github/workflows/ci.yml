# Tests the backend and frontend on every push and pull request. On main, once both pass, it also builds
# the Docker image, pushes it to GitHub's container registry, and rolls it out to Azure Container Apps.
name: CI

on:
    push:
        branches: [main]
    pull_request:
    # Lets you redeploy from the Actions tab (or `gh workflow run ci.yml`) without a new commit.
    workflow_dispatch:

permissions:
    contents: read

env:
    IMAGE: ghcr.io/krishatgit/clearwave
    APP: clearwave
    RESOURCE_GROUP: clearwave-rg

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
            - run: uv sync --frozen
            - run: uv run pytest

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    image:
        # Only after both test jobs pass, and never for pull requests.
        needs: [backend, frontend]
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    ${{ env.IMAGE }}:${{ github.sha }}
                    ${{ env.IMAGE }}:latest
                # Reuse unchanged layers (npm ci, uv sync) from earlier runs.
                cache-from: type=gha
                cache-to: type=gha,mode=max

    deploy:
        needs: image
        # Skipped until the Azure resources exist and their IDs are saved as repository variables.
        if: vars.AZURE_CLIENT_ID != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            # Signs in with a short-lived GitHub token that Azure trusts (OIDC), so no password is stored anywhere.
            - uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Roll out the new image
              run: az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --image "$IMAGE:${{ github.sha }}"
            - name: Check it's healthy
              run: |
                url="https://$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
                # It may be starting from zero replicas and running migrations, so give it a couple of minutes.
                for i in $(seq 1 24); do
                    if curl -fsS "$url/api/health" | grep -q '"database":true'; then echo "Healthy: $url"; exit 0; fi
                    sleep 5
                done
                echo "No healthy response from $url/api/health" && exit 1
