[project]
name = "clearwave-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "azure-storage-blob>=12.31.1",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
