services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clearwave
      POSTGRES_PASSWORD: clearwave
      POSTGRES_DB: clearwave
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearwave"]
      interval: 2s
      retries: 15

volumes:
  pgdata: