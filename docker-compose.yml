services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clearwave
      POSTGRES_PASSWORD: clearwave
      POSTGRES_DB: clearwave
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearwave"]
      interval: 2s
      retries: 15
  
  storage:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - blobdata:/data

volumes:
  pgdata:
  blobdata:

